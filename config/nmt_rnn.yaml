task: EN2FR

data:
  train_file: data/eng-fra_train.txt
  test_file: data/eng-fra_test.txt

model:
  hidden_size: 1000
  embedding_dim: 300
  teacher_forcing_ratio: 0.5
  vocab_size: 30000

training:
  batch_size: 128
  learning_rate: 0.001
  max_epochs: 10
  random_seed: 54321
  validation_ratio: 0.1

# Download GoogleNews-vectors-negative300.bin separately and set its path here.
embedding_file: GoogleNews-vectors-negative300.bin


